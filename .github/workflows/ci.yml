name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Validate Prisma schema
        run: ./node_modules/.bin/prisma validate

      - name: Run predeploy checks
        run: node scripts/predeploy.mjs --skip-env-check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --production

      - name: Build API server
        run: npm run build --workspace=artifacts/api-server

      - name: Build frontend packages
        run: npm run build:frontend:xpadmin

      - name: Build API Zod package
        run: npm run build --workspace=lib/api-zod
